<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Inventario QA Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
  <canvas id="particles"></canvas>
  <span class="doodle" style="top:12%;left:8%;font-size:34px;animation-delay:0s">✿</span>
  <span class="doodle" style="top:70%;left:12%;font-size:28px;animation-delay:1.2s">★</span>
  <span class="doodle" style="top:20%;right:10%;font-size:30px;animation-delay:.6s">❋</span>
  <span class="doodle" style="bottom:12%;right:14%;font-size:34px;animation-delay:2s">✎</span>
  <div class="win login-card">
    <div class="win-bar">
      <span>login.exe</span>
      <span class="win-dots"><i></i><b>_</b><i class="x"></i></span>
    </div>
    <h1>Login</h1>
    <p class="subtitle">Control de stock interno</p>
    <form id="loginForm">
      <label>Usuario
        <input id="username" name="username" type="text" value="admin" autocomplete="username" placeholder="username">
      </label>
      <!-- BUG-QA-05 (principiante): el password se ve en claro, es type="text" en vez de password -->
      <label>Contraseña
        <input id="password" name="password" type="text" value="admin123" autocomplete="current-password" placeholder="••••">
      </label>
      <button type="submit">Ingresar</button>
      <p id="loginError" class="error"></p>
    </form>
    <p class="hint">Demo: admin / admin123 &nbsp;|&nbsp; vendedor / venta123</p>
  </div>
  <script>
    // Doodles flotantes estilo bencho (decorativo, sin librerías externas)
    (function () {
      const c = document.getElementById('particles');
      const ctx = c.getContext('2d');
      const shapes = ['○', '✕', '△', '〜'];
      let W, H, pts = [];
      function resize() {
        W = c.width = innerWidth; H = c.height = innerHeight;
        pts = Array.from({ length: 34 }, () => ({
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4,
          s: shapes[Math.floor(Math.random() * shapes.length)],
          r: Math.random() * Math.PI * 2
        }));
      }
      resize(); addEventListener('resize', resize);
      (function tick() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = 'rgba(0,177,157,.35)';
        ctx.font = '16px serif';
        for (const p of pts) {
          p.x += p.vx; p.y += p.vy; p.r += .005;
          if (p.x < 0 || p.x > W) p.vx *= -1;
          if (p.y < 0 || p.y > H) p.vy *= -1;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
          ctx.fillText(p.s, 0, 0); ctx.restore();
        }
        requestAnimationFrame(tick);
      })();
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const err = document.getElementById('loginError');
      err.textContent = '';
      err.classList.remove('shake');
      try {
        const r = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await r.json();
        if (!r.ok || !data.ok) {
          err.textContent = data.message || 'Error';
          void err.offsetWidth;
          err.classList.add('shake');
          return;
        }
        localStorage.setItem('qa_token', data.token);
        localStorage.setItem('qa_user', JSON.stringify(data.user));
        window.location.href = '/dashboard.html';
      } catch {
        err.textContent = 'Error de red';
        void err.offsetWidth;
        err.classList.add('shake');
      }
    });
  </script>
</body>
</html>
